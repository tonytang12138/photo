<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影作品集 - 欢迎</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#1E293B',
                        dark: '#0F172A',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            }
            .bg-gradient-radial {
                background-image: radial-gradient(circle, var(--tw-gradient-stops));
            }
        }
        
        /* Custom styles */
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        .welcome-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        .welcome-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.6);
            z-index: -1;
        }
        
        .enter-button {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .enter-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .enter-button:hover::after {
            width: 300px;
            height: 300px;
        }
        
        .enter-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .enter-button:active {
            transform: translateY(-1px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }
        
        .scroll-indicator {
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
        
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background-color: #3B82F6;
            width: 0%;
            z-index: 100;
            transition: width 0.2s ease;
        }
        
        .countdown {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="bg-dark text-light">
    <!-- Progress Bar -->
    <div id="progress-bar" class="progress-bar"></div>
    
    <!-- Welcome Container -->
    <div class="welcome-container flex flex-col items-center justify-center relative">
        <!-- Background Image -->
        <img src="https://p3-doubao-search-sign.byteimg.com/labis/9c1e919a67e24c3b33574db82feb0136~tplv-be4g95zd3a-image.jpeg?lk3s=feb11e32&x-expires=1792899148&x-signature=jSyUh1NDd%2BGEqA6vYSSWH1%2BaODg%3D" alt="Mountain Landscape" class="welcome-bg">
        
        <!-- Overlay -->
        <div class="absolute inset-0 bg-gradient-radial from-dark/70 via-dark/50 to-dark/90 z-0"></div>
        
        <!-- Content -->
        <div class="container mx-auto px-4 text-center z-10" id="welcome-content">
            <!-- Logo/Brand -->
            <div class="mb-8" data-animation="fade-up">
                <h1 class="text-5xl md:text-7xl font-bold mb-4 text-light">摄影艺术</h1>
                <div class="w-24 h-1 bg-primary mx-auto mb-4"></div>
                <p class="text-xl md:text-2xl text-gray-300">摄影作品集</p>
            </div>
            
            <!-- Tagline -->
            <div class="mb-12 max-w-2xl mx-auto" data-animation="fade-up" data-delay="0.2">
                <p class="text-lg md:text-xl text-gray-200 italic">
                    "通过摄影艺术捕捉永恒的瞬间"
                </p>
            </div>
            
            <!-- Enter Button -->
            <div class="mb-16" data-animation="fade-up" data-delay="0.4">
                <button id="enter-button" class="enter-button bg-primary hover:bg-blue-600 text-white font-bold py-4 px-10 rounded-full text-lg md:text-xl transition-all duration-300 flex items-center justify-center group">
                    <span class="mr-2">进入画廊</span>
                    <i class="fa fa-arrow-right transform group-hover:translate-x-1 transition-transform duration-300"></i>
                </button>
            </div>
            
            <!-- Auto-redirect Info -->
            <div class="text-gray-400 text-sm md:text-base" data-animation="fade-up" data-delay="0.6">
                <p>您将在 <span id="countdown" class="countdown font-semibold text-primary">10</span> 秒后自动跳转</p>
            </div>
        </div>
        
        <!-- Scroll Indicator -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 scroll-indicator z-10" data-animation="fade-in" data-delay="0.8">
            <i class="fa fa-angle-down text-3xl text-primary/80"></i>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize GSAP animations
            const welcomeContent = document.getElementById('welcome-content');
            const animatedElements = document.querySelectorAll('[data-animation]');
            
            // Animate elements
            animatedElements.forEach(element => {
                const animation = element.getAttribute('data-animation');
                const delay = element.getAttribute('data-delay') || 0;
                
                gsap.fromTo(element, 
                    { 
                        opacity: 0,
                        y: animation === 'fade-up' ? 30 : 0,
                        x: animation === 'fade-left' ? -30 : (animation === 'fade-right' ? 30 : 0)
                    },
                    { 
                        opacity: 1, 
                        y: 0,
                        x: 0,
                        duration: 0.8,
                        delay: delay,
                        ease: 'power2.out'
                    }
                );
            });
            
            // Progress Bar Animation
            simulateLoading();
            
            // Enter Button Click Event
            const enterButton = document.getElementById('enter-button');
            enterButton.addEventListener('click', function() {
                navigateToGallery();
            });
            
            // Keyboard Navigation
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    navigateToGallery();
                }
            });
            
            // Touch Swipe Navigation
            let touchStartY = 0;
            let touchEndY = 0;
            
            document.addEventListener('touchstart', function(e) {
                touchStartY = e.changedTouches[0].screenY;
            }, false);
            
            document.addEventListener('touchend', function(e) {
                touchEndY = e.changedTouches[0].screenY;
                handleSwipe();
            }, false);
            
            function handleSwipe() {
                const swipeThreshold = 50;
                if (touchStartY - touchEndY > swipeThreshold) {
                    // Swipe up
                    navigateToGallery();
                }
            }
            
            // Auto-redirect Countdown
            let countdown = 10;
            const countdownElement = document.getElementById('countdown');
            const countdownInterval = setInterval(function() {
                countdown--;
                countdownElement.textContent = countdown;
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    navigateToGallery();
                }
            }, 1000);
            
            // Simulate Loading Progress
            function simulateLoading() {
                const progressBar = document.getElementById('progress-bar');
                let width = 0;
                
                const interval = setInterval(function() {
                    if (width >= 100) {
                        clearInterval(interval);
                    } else {
                        // Random increment to simulate loading
                        const increment = Math.random() * 5;
                        width += increment;
                        progressBar.style.width = width + '%';
                    }
                }, 100);
            }
            
            // Navigate to Gallery
            function navigateToGallery() {
                // Add exit animation
                gsap.to(welcomeContent, {
                    opacity: 0,
                    y: -20,
                    duration: 0.5,
                    onComplete: function() {
                        window.location.href = 'gallery.html';
                    }
                });
            }
            
            // Pause countdown on user interaction
            document.addEventListener('mousemove', pauseCountdown);
            document.addEventListener('keydown', pauseCountdown);
            document.addEventListener('touchstart', pauseCountdown);
            
            function pauseCountdown() {
                clearInterval(countdownInterval);
                document.removeEventListener('mousemove', pauseCountdown);
                document.removeEventListener('keydown', pauseCountdown);
                document.removeEventListener('touchstart', pauseCountdown);
            }
        });
    </script>
</body>
</html>
